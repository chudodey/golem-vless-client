# ==============================================================================
# Бэклог проекта golem-vless-client — машиночитаемый список идей и задач.
#
# Схема (YAML):
#   version      — версия схемы файла (при ломке формата увеличивать)
#   items        — список записей; одна запись = одна идея/задача
#
# Поля записи:
#   id           — уникальный код, формат B-NNN, новый берётся = max+1
#   title        — короткое название (до ~80 символов)
#   status       — idea | planned | in-progress | blocked | done | wontdo
#   priority     — low | medium | high
#   area         — core (рендерер/общий) | linux | windows | docs | infra
#   created      — дата создания, YYYY-MM-DD
#   description  — что и зачем делать (свободный текст, 1-3 абзаца)
#   acceptance   — как проверить, что готово (необязательно)
#   notes        — уточнения, найденные факты, ссылки (необязательно)
#
# Как добавить запись (вручную или агенту):
#   1) прочитать файл, взять max(id) из items и прибавить 1;
#   2) скопировать любой существующий items-блок и заполнить поля;
#   3) НЕ менять id у уже существующих записей (история живёт в git);
#   4) после правки файл должен оставаться валидным YAML.
#
# Статус "done" не удаляется — прошлые решения остаются в бэклоге.
# ==============================================================================

version: 1

items:
  - id: B-001
    title: Живое TCP-сканирование нод перед сборкой конфига
    status: done
    priority: high
    area: core
    created: 2026-08-05
    description: >
      Перед сборкой конфига клиент параллельно пингует все ноды подписки
      (TCP до host:port), отсеивает мёртвые и упорядочивает пул urltest по
      измеренной задержке. Медленная нода "Auto/Оптимальная локация"
      (~1600 мс) больше не выигрывает гонку; в пул попадают только живые
      быстрые ноды. Если авто-выбор выключен и ACTIVE-нода мертва — клиент
      сам переключается на быстрейшую живую.
    acceptance: >
      render_config.py при сборке печатает "...живых N/M" и "...быстрейшая:
      #N <имя> — X мс"; в config.json члены urltest-группы отсортированы по
      пингу; sing-box check проходит.
    notes: >
      Флаги --no-probe, --probe-timeout, --probe-concurrency. --check-only
      сканирование не запускает. Фича общая для Windows и Linux.

  - id: B-002
    title: Fallback на живую ноду при мёртвой ACTIVE
    status: done
    priority: medium
    area: core
    created: 2026-08-05
    description: >
      В режиме авто-выбора "no" (закреплённая ACTIVE= нода) при мёртвой
      ноде конфиг собирался с мёртвым выходом. Теперь при провале пинга
      ACTIVE-ноды выбирается быстрейшая живая, с предупреждением в stderr.
    acceptance: ACTIVE=<мёртвый индекс> в автономном режиме собирает конфиг с живой нодой.

  - id: B-003
    title: Исключить ноды "Белые списки" из общего пула urltest
    status: done
    priority: high
    area: windows
    created: 2026-08-05
    description: >
      Ноды с меткой "[Белые списки]" (Spain 2, Italy 2, cachebeam) имеют
      низкий TCP-пинг, поэтому выигрывают urltest-гонку, но пропускают только
      ограниченный список сайтов. Через них youtube/google не работают.
      Нужно: либо не включать whitelist-ноды в общий пул (выделить отдельный
      outbound/группу), либо добавлять их в пул только как fallback.
    acceptance: >
      После старта клиент не выбирает whitelist-ноды по умолчанию; страна
      выхода и работоспособность google.com подтверждают выбор обычной ноды.
    notes: >
      Найдено в ходе теста split-маршрутизации (05.08.2026). Реализовано
      через B-010: HTTP-проверка www.youtube.com отсеивает whitelist-ноды
      (youtube через них не даёт 200) на этапе сборки пула — в urltest-гонку
      они не попадают.

  - id: B-004
    title: YouTube и Anthropic блокируются на всех нодах провайдера Durev
    status: idea
    priority: high
    area: provider
    created: 2026-08-05
    description: >
      Все проверенные ноды подписки выходят через дата-центровые IP (OVH и
      др.), которые YouTube блокирует по TLS/SNI (www.youtube.com по HTTPS
      не отвечает рукопожатием, http://www.youtube.com отвечает 301), а
      Anthropic отвечает 403 (claude.ai). Даже ноды "YT без рекламы" и
      "Gemini/Roblox"-warp выходят не через настоящий Cloudflare WARP.
      Результат: youtube и claude через эту подписку не работают.
    acceptance: >
      Найти подписку/ноды с резидентными или настоящими WARP-выходами, где
      www.youtube.com отдаёт 200 и claude.ai не даёт 403, и включить их в
      endpoints.txt.
    notes: >
      Это объясняет Forbidden для claude.ai/nemotron-3-ultra-free, с которым
      пользователь столкнулся до диагностики. Ограничение провайдера, не
      баг клиента.

  - id: B-005
    title: Скрипт самопроверки split-маршрутизации без TUN/админа
    status: planned
    priority: medium
    area: windows
    created: 2026-08-05
    description: >
      Оформить в windows/ скрипт, который поднимает sing-box в режиме
      локального прокси (--no-tun, те же правила) и проверяет: госуслуги идут
      напрямую (RU), youtube/прочие via-vpn идут через VPN (иностранный
      выход), через cloudflare.com/cdn-cgi/trace. Позволяет тестировать split
      и живость нод без прав администратора.
    acceptance: >
      Скрипт завершается с понятным отчётом: для каждого домена ожидаемый и
      фактический маршрут, exit IP/страна VPN.
    notes: Прототип проверен вручную 05.08.2026 (diag.ps1 в temp).

  - id: B-006
    title: Документировать в policy.conf ограничения провайдера Durev
    status: idea
    priority: low
    area: docs
    created: 2026-08-05
    description: >
      В policy.conf рядом с youtube.com добавить комментарий: через ноды
      Durev/cloudpath youtube и claude могут не работать из-за блокировки
      дата-центровых IP; включать в [domains-via-vpn] осознанно.
    acceptance: Комментарий в policy.conf не противоречит реальному поведению.

  - id: B-007
    title: sing-box не поддерживает транспорт xhttp (SplithTTP) — нужен xray
    status: done
    priority: high
    area: core
    created: 2026-08-05
    description: >
      Основные ноды подписки Durev работают на :8443 с транспортом xhttp
      (type=xhttp, mode=stream-one, path=/xhttp, concurrency=4,
      security=reality). Проверено: sing-box 1.11.15 и 1.13.16 отвечают
      "unknown transport type: xhttp" (и splithttp тоже) — этот транспорт
      sing-box вообще не реализует (только http/ws/quic/grpc/httpupgrade).
      Именно поэтому приложение Durev строит цепочку sing-box(tun) ->
      socks 127.0.0.1:13001 -> xray: xray эти ноды и держит.
    acceptance: >
      Стэк клиента либо использует xray для xhttp-нод, либо отфильтровывает
      их (см. B-003) и полагается на ws-ноды. sing-box сам по себе не
      говорит с xhttp-нодами.
    notes: >
      Проверено на sing-box 1.13.16 (05.08.2026). Реальный фикс (не
      фильтрация, а поддержка xhttp через xray-core) сделан в B-011
      (09.08.2026) — та же цепочка, что и у самого Durev.

  - id: B-008
    title: Рабочие ноды — ws-ноды whitelist (cdn.assetrelay.store)
    status: done
    priority: high
    area: core
    created: 2026-08-05
    description: >
      Из подписки Durev (https://your-durev.com/sub/.../about/) декодирован
      свежий список: 55 нод, почти все xhttp, но 7 ws-нод на
      cdn.assetrelay.store:443 (type=ws, tls, path=/stream/updates/<ID>).
      Эти ws-ноды sing-box понимает, и они открывают доступ к AI:
      api.anthropic.com -> 401, api.openai.com -> 401, www.youtube.com -> 200.
      Раньше допускалось, что youtube/claude не работают вовсе (B-004) —
      на самом деле работают именно эти CDN-outlets.
    acceptance: >-
      endpoints.txt содержит только ws-ноды cdn.assetrelay.store; проверено
      oодиночными запросами каждая нода даёт 401/200 (кроме заблокированных).
    notes: Выход IP 149.33.41.113/110 (DE), 38.x (US), 147.x (FI).

  - id: B-009
    title: Разные ws-ноды дают разный доступ к AI — нужна фильтрация
    status: done
    priority: high
    area: core
    created: 2026-08-05
    description: >
      При oодиночном тесте каждой ws-ноды выяснилось: 6/7 дают 401 на
      api.anthropic.com, но "Russia 52" даёт 403 (заблокированный upstream),
      а "Finland 42" не держит YouTube. В общем пуле urltest sing-box выбирает
      ноду по задержке на каждое соединение, поэтому может уйти на
      проблемную ноду и получить 403. Нужно: либо фильтровать пул до
      проверенных 401-нод, либо аккуратно выбрать ACTIVE.
    acceptance: >
      После сборки конфига api.anthropic.com отвечает 401 (не 403),
      www.youtube.com — 200; проверено на повторных запросах.
    notes: >
      Реализовано через B-010: каждая живая нода проверяется реальным
      запросом к api.anthropic.com (ждём 401) и www.youtube.com (ждём 200),
      в пул urltest попадают только прошедшие проверку. Русская нода с 403
      и финская без YouTube автоматически отсеиваются при каждой сборке.

  - id: B-010
    title: Авто-рефильтр пула при обновлении подписки (ноды Durev нестабильны)
    status: done
    priority: high
    area: core
    created: 2026-08-05
    description: >
      Список и состав нод провайдера постоянно меняется: нода, которая
      сегодня даёт 401 на api.anthropic.com и 200 на YouTube, завтра может
      давать 403 или исчезнуть вовсе. Поэтому статичный endpoints.txt и
      ручной скан быстро устаревают. Нужен механизм, который при каждом
      --fetch/сборке автоматически:
        1) отбрасывает xhttp/splithttp (sing-box их не понимает, см. B-007);
        2) пингует оставшиеся ws/tcp ноды;
        3) проверяет каждую живой ноды на api.anthropic.com (ждать 401/403)
           и www.youtube.com (ждать 200);
        4) в пул urltest включает только прошедшие проверку.
      Ручной фильтр остаётся как fallback/блокировка по имени.
    acceptance: >
      Свежая подписка с 50+ нодами собирается в конфиг, пул urltest содержит
      только ноды с подтверждённым 401/200; регрессий на стабильных нодах нет.
    notes: >
      Решает и B-003 (whitelist-ноды), и B-009. Реализовано в render_config.py:
      флаги --http-probe {on,off,recover}, --http-probe-anthropic (по умолчанию
      401), --http-probe-youtube (200), --http-probe-timeout (8 с) и
      --http-probe-cache-ttl (6 ч). С Xray-core (B-011) xhttp-ноды проверяются
      через одноразовый xray, а не sing-box. Результаты кешируются в
      state\node-probe-cache.json, чтобы не перепроверять каждый рестарт.

  - id: B-011
    title: Xray-core как второй движок — реальная поддержка xhttp/splithttp (не фильтр)
    status: done
    priority: high
    area: core
    created: 2026-08-09
    description: >
      Вместо того чтобы отбрасывать xhttp/splithttp-ноды (B-007/B-008,
      оставлявшие живыми только 4-7 ws-нод из 55 — отсюда и хроническая
      нестабильность, которую приходилось чинить руками), клиент теперь
      держит их через Xray-core — ту же цепочку sing-box(TUN)->xray, что
      использует официальное приложение Durev (подтверждено разбором его
      процессов 09.08.2026: sing-box и xray оба дочерние для "Durev VPN").
      render_config.py: узлы получают meta.engine = "xray"|"sing-box" при
      парсинге (не отбрасываются); xhttp/splithttp-узлы больше не пытаются
      стать sing-box outbound. Новые функции: vless_uri_to_xray_outbound()
      (VLESS URI -> схема Xray, независимо от sing-box-парсера),
      build_xray_config() (N нод -> один локальный SOCKS через
      routing.balancers + observatory/leastPing — встроенный аналог
      urltest, но внутри Xray), find_xray(). sing-box получает единственный
      дополнительный outbound "xray-pool" (socks на 127.0.0.1:2081) как ещё
      одного участника гонки urltest — гонка идёт "лучшая нативная нода"
      против "лучшая xray-управляемая нода", а не против 40+ нод, которые
      sing-box всё равно не смог бы набрать. B-010 (HTTP-проверка
      Anthropic/YouTube) расширена: xhttp-ноды проверяются через
      одноразовый xray вместо sing-box (_probe_single_node диспетчеризует
      по engine). Новые флаги: --xray-port (по умолчанию 2081), --no-xray
      (вернуться к старому поведению — отбрасывать xhttp).
      Windows: Run-GolemVless.ps1 стартует xray.exe перед sing-box.exe,
      только если рендер написал state\xray-config.json; GolemVpn.ps1 и
      Watch-GolemVless.ps1 знают про xray.exe (статус/остановка/watchdog),
      но не считают его отсутствие ошибкой, если xhttp-нод в подписке нет.
      Install-GolemVless.ps1 копирует windows\bin\xray.exe (в репозитории,
      скачан и проверен по SHA-256 с официального
      github.com/XTLS/Xray-core, v26.3.27) либо скачивает сам при первой
      установке.
    acceptance: >
      xray.exe run -test -config <сгенерированный xray-config.json> ->
      "Configuration OK"; sing-box.exe check -c <config.json> с
      "xray-pool"-outbound проходит без ошибок. Проверено на трёх
      синтетических случаях: только xray-ноды (одна закреплена, ACTIVE=N),
      только xray-ноды (autoselect, вырождается в единственный socks-outbound
      без urltest-обёртки), смешанный пул (4 нативные ws-ноды + 1
      xray-нода, urltest с 5 участниками включая "xray-pool"). Реальная
      подписка Durev (55 нод, xhttp) для интеграционного теста не
      использовалась — секрет не публикуется, тест собран на фиктивных
      vless://... URI.
    notes: >
      Живой прогон через реальный TUN состоялся 11.08.2026 с реальной
      подпиской Durev (55 нод, основная часть xhttp): xray-config.json
      генерируется, xray.exe стартует и принимает соединения на :2081.
      Подтверждено логами state\sing-box-*.*.log за 11.08.2026. Дальнейший
      шаг (если появится): зафиксировать, что urltest реально переключается
      между "лучшая нативная" и "xray-pool" при деградации одного из них.

  - id: B-012
    title: Ежедневное автообновление подписки (Refresh-Subscription, кэш последней подписки)
    status: done
    priority: high
    area: windows
    created: 2026-08-11
    description: >
      Подписка Durev меняется ежедневно, и полагаться на ручной refresh нельзя.
      Добавлен windows\Refresh-Subscription.ps1 и задача планировщика
      GolemVLESS-Refresh (daily 04:00). Первая половина: скачивает свежую
      подписку в state\last-subscription.txt — тот же файл, что рендерер
      использует как офлайн-фолбэк при сбое --fetch. Вторая: сравнивает
      sha256 нового пула с state\subscription.sha256 и перезапускает клиент
      только если состав нод реально изменился. Endpoints.txt при этом не
      трогается — остаётся первоисточником ссылки.
    acceptance: >
      Задача GolemVLESS-Refresh существует в планировщике; при изменении
      подписки клиент перезапускается сам (лог state\subscription-refresh.log),
      при неизменной — не трогается. Команда GolemVpn.ps1 refresh даёт
      ручной запуск с -Force.
    notes: >
      Внутри render_config.py тоже есть кэш last-subscription.txt на случай
      недоступности подписки — оба механизма пишут/читают один файл.

  - id: B-013
    title: Telegram идёт через VPN по CIDR и geosite (не только по доменам)
    status: done
    priority: medium
    area: core
    created: 2026-08-11
    description: >
      Telegram Desktop ходит не только на поддомены t.me/telegram.org, но и
      напрямую на IP 91.108.x / 149.154.x (MTProto/CDN). Раньше часть таких
      соединений шла мимо политики. Добавлены правила маршрутизации:
      по ip_cidr (149.154.0.0/16, 91.108.4.0/22 и др.) трафик через TUN
      направляется в proxy, а DNS-ответы с такими адресами резолвятся
      dns-remote (никакого DNS-leak). Плюс rule_set geosite-telegram для
      поддоменов, которые не поймал email/доменный список.
    acceptance: >
      При включённом клиенте телеграм-соединения к голым IP-адресам (без
      домена) идут через VPN; geosite-telegram подгружается из sing-geosite.
    notes: >
      Список 91.108.* взят из официальной инструкции Telegram для IPv4;
      поддерживается в sync с DNS-remote. Исправление касалось gvisor-stack
      TUN — там с прямыми подключениями к CDN был DNS-yoyo.

  - id: B-014
    title: Ротация логов state (sing-box/xray копят сотни мегабайт)
    status: planned
    priority: medium
    area: windows
    created: 2026-08-11
    description: >
      Каждый старт Run-GolemVless.ps1 создаёт sing-box-<timestamp>.{out,err}.log
      и xray-<timestamp>.{out,err}.log, которые никогда не чистятся. На
      11.08.2026 в state накопилось 80 файлов и ~150 МБ (один лог 55 МБ).
      Нужна ротация: хранить только последние N пар логов (например 20) и
      удалять старые при каждом старте; плюс не давать стеку правил раздувать
      err-лог при вечно повторяющихся варнингах.
    acceptance: >
      После нескольких рестартов в state остаётся не более N пар логов,
      суммарный размер стабилен; старые файлы удаляются автоматически.
    notes: >
      В т.ч. зафиксирован 55МБ err-лог повторов "warning: replicate interface"
      — полезной информации там нет, ротация снимает проблему.
