# ═══════════════════════════════════════════════════════════════════════════
#  ПОЛИТИКА VPN — единственный файл, который нужно править
# ═══════════════════════════════════════════════════════════════════════════
#
#  После любой правки применить:      vpnctl reload
#  Посмотреть что получилось:         vpnctl status
#
#  Правила синтаксиса, общие для всех списков:
#    • одна запись на строку
#    • пустые строки и строки с # — игнорируются
#    • # можно ставить и в конце строки — всё после него комментарий
#
# ═══════════════════════════════════════════════════════════════════════════


# ───────────────────────────────────────────────────────────────────────────
[processes-via-vpn]
# ───────────────────────────────────────────────────────────────────────────
# Программы, которые ВСЕГДА ходят через VPN — куда бы они ни лезли,
# независимо от списков доменов ниже.
#
# Два способа записи:
#
#   claude                        ← по имени процесса (совпадает с любым путём)
#   /opt/antigravity/antigravity  ← по полному пути (точнее, рекомендуется)
#
#  ⚠️  ВАЖНО про Claude Code и другие Node-приложения:
#      Claude Code запускается как процесс `node`, своего имени у него нет.
#      Если написать здесь `node` — через VPN пойдут ВСЕ Node-программы.
#      Чтобы завернуть только Claude Code, укажите полный путь к его
#      launcher-скрипту, например:
#          /usr/lib/node_modules/@anthropic-ai/claude-code/cli.js
#      Узнать путь:  readlink -f $(command -v claude)
#
#  ⚠️  Работает только при включённом TUN (режим по умолчанию).
#      В режиме NO_TUN=1 правила по процессам не действуют.
#
#  Проверить, что программа реально идёт через VPN:
#      vpnctl check <имя>       (сравнит IP этой программы и обычный)
#  или вручную:
#      curl https://ifconfig.io/ip            ← должен быть домашний IP
#      <ваша программа> ... ifconfig.io/ip    ← должен быть IP VPN

claude
# Windows desktop clients (process matching differs by sing-box version, so
# both forms are intentional):
claude.exe
codex
codex.exe

# Примеры — раскомментируйте нужное:
# node                 # ОСТОРОЖНО: заворачивает все Node-приложения сразу
# code                 # VS Code
# docker
# git


