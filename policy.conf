# ───────────────────────────────────────────────────────────────────────────
[auto-select]
# ───────────────────────────────────────────────────────────────────────────
# Автоматический выбор самого быстрого сервера.
#
# Как работает: sing-box сам, раз в `interval`, пингует серверы-кандидаты
# (открывает к каждому тестовое соединение) и переключается на самый
# быстрый. Переключение мгновенное и не рвёт текущие соединения.
# Если сервер отвалился — уходит на следующий по скорости автоматически.

# yes — автовыбор включён (рекомендуется)
# no  — всегда использовать один сервер (номер задаётся в ACTIVE=
#       внутри secrets/endpoints.txt)
enabled = yes

# Как часто перепроверять скорость.
# Слишком часто не нужно: каждая проверка — это реальные соединения
# ко всем кандидатам сразу.  Разумно 3–10 минут.
interval = 5m

# Сколько серверов участвует в гонке (берутся первые N из подписки).
# Все 55 гонять смысла нет — это лишняя нагрузка и трафик.
# 8–15 достаточно, чтобы всегда был живой быстрый вариант.
candidates = 12

# Насколько новый сервер должен быть быстрее текущего (в миллисекундах),
# чтобы произошло переключение. Защита от «дёрганья» между двумя
# серверами с почти одинаковым пингом.
tolerance = 50

# Ноды с этими метками первыми попадают в пул urltest. Durev помечает часть
# маршрутов Gemini/Roblox; это лишь предпочтение маршрута, не гарантия доступа
# к сервисам Google. Если таких нод нет или они упали, выбираются остальные.
preferred_tags = Gemini, Roblox

# Куда стучимся для замера скорости. Этот адрес отдаёт пустой ответ
# и специально предназначен для проверки связи.
test_url = https://www.gstatic.com/generate_204
